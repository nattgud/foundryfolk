<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Foundryfolk</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/pwa/apple-touch-icon.png">
  <meta name="theme-color" content="#14110f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Foundryfolk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Laddningsruta: syns direkt, före alla skript */
    #loading { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #14110f; color: #e8dcc8; font: 600 16px system-ui, sans-serif; transition: opacity .4s; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .logo { width: min(500px, 60vw); height: auto; }
    #loading .track { width: min(320px, 70vw); height: 12px; border-radius: 6px; background: #2c2620; overflow: hidden; }
    #loading .fill { height: 100%; width: 0; background: #e0a53a; border-radius: 6px; transition: width .25s ease-out; }
    #loading .text { font-size: 13px; opacity: .75; min-height: 1.2em; text-align: center; padding: 0 16px; }
    #loading.error .fill { background: #c0392b; }
  </style>
</head>
<body onload="loadAllGameComponents()">
  <div id="loading"><img class="logo" src="images/foundryfolk_logo_image.png" alt="Foundryfolk" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'"><div class="title">Foundryfolk</div><div class="track"><div class="fill" id="loadingFill"></div></div><div class="text" id="loadingText">Loading…</div></div>
  <canvas id="gameCanvas"></canvas>
  <div id="top"></div>
  <div id="info"></div>
  <div id="bottom"></div>
  <div id="toast"></div>

  <script>
    var version = "0.9.2052";
    // Service workern får versionen i adressen: en ny version ger en ny cache som förladdas, och den gamla rensas
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + version).catch(() => {});
    document.write('<script src="js/files.js?v=' + version + '"><\/script>');   // skriptlistan (GAME_SCRIPTS), ihop med service workern

    // Laddningsstapel. set(0-1, text), paint() ger webbläsaren tid att rita, done() döljer rutan.
    window.GameLoading = {
      shown: 0,
      set(fraction, text) {
        this.shown = Math.max(this.shown, Math.min(1, fraction)); // stapeln går aldrig bakåt
        document.getElementById('loadingFill').style.width = (this.shown * 100).toFixed(1) + '%';
        if (text) document.getElementById('loadingText').textContent = text + '…';
      },
      paint() {
        return new Promise(resolve => {
          let finished = false;
          const finish = () => { if (!finished) { finished = true; resolve(); } };
          requestAnimationFrame(() => setTimeout(finish, 0));
          setTimeout(finish, 80); // om fliken är dold ritas inget, vänta inte i onödan
        });
      },
      done() {
        const box = document.getElementById('loading');
        box.classList.add('hide');
        setTimeout(() => box.remove(), 500);
      },
      fail(error) {
        document.getElementById('loading').classList.add('error');
        document.getElementById('loadingText').textContent = 'Error: ' + (error && error.message || error);
      }
    };

    function loadAllGameComponents() {
      // Den strikta ordningen av alla skript (js/files.js)
      const scriptOrder = GAME_SCRIPTS;

      // Alla skript hämtas samtidigt men körs i ordning (async = false), så laddningen går snabbare än ett skript i taget.
      // Stapeln följer antalet körda skript.
      let loaded = 0, failed = false;
      const totalScripts = scriptOrder.length;
      GameLoading.set(0, 'Loading');

      function start() {
        console.log('Game components loaded!');
        // SÄKERHETSKONTROLL: Anropa init endast om vi tror att CityBuilder är redo
        if (window.CityBuilder && window.CityBuilder.Game && typeof window.CityBuilder.Game.init === 'function') {
          window.CityBuilder.Game.init();
          console.log('CityBuilder.Game.init() started.');
          // Spelets objekt tas bort från den globala namnrymden: modulerna har redan sina egna referenser, men från konsolen går det inte längre att
          // nå ekonomi, värld och inställningar. Med ?debug i adressen finns det kvar (för utveckling och tester).
          if (!/[?&]debug\b/.test(location.search)) delete window.CityBuilder;
        } else {
          console.warn('Initialization failed: CityBuilder.Game.init() is not defined.');
          GameLoading.fail(new Error('Game.init is not defined'));
        }
      }

      for (const file of scriptOrder) {
        const scriptPath = file + "?v=" + version;
        const script = document.createElement('script');
        script.src = scriptPath;
        script.async = false;
        script.onload = () => {
          GameLoading.set(.4 * ++loaded / totalScripts, 'Loading');
          if (loaded === totalScripts && !failed) start();
        };
        script.onerror = error => {
          console.error(`FATAL ERROR: Failed to load script ${scriptPath}`, error);
          if (!failed) GameLoading.fail(new Error('Failed to load ' + file));
          failed = true;
        };
        document.head.appendChild(script);
      }
    }
  </script>

</body>
</html>
