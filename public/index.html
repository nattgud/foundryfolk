<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Foundryfolk</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="images/pwa/apple-touch-icon.png">
  <meta name="theme-color" content="#14110f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Foundryfolk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Laddningsruta: syns direkt, före alla skript */
    #loading { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #14110f; color: #e8dcc8; font: 600 16px system-ui, sans-serif; transition: opacity .4s; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .logo { width: min(500px, 60vw); height: auto; }
    #loading .track { width: min(320px, 70vw); height: 12px; border-radius: 6px; background: #2c2620; overflow: hidden; }
    #loading .fill { height: 100%; width: 0; background: #e0a53a; border-radius: 6px; transition: width .25s ease-out; }
    #loading .text { font-size: 13px; opacity: .75; min-height: 1.2em; text-align: center; padding: 0 16px; }
    #loading.error .fill { background: #c0392b; }
    /* "Klicka för att börja": visas efter laddningen när webbläsaren inte fått någon användaråtgärd än (oftast vid omladdning), så att ljudet kan startas */
    #loading.ready .track, #loading.ready .text { display: none; }
    #startButton { appearance: none; border: 0; cursor: pointer; padding: 16px 46px; border-radius: 999px; background: #e0a53a; color: #1b1510;
      font: 700 20px/1 system-ui, sans-serif; letter-spacing: .04em; box-shadow: 0 6px 24px rgba(0,0,0,.45); transition: transform .15s, background .15s;
      animation: startPulse 2.2s ease-out infinite; }
    #startButton::before { content: '\25B6'; margin-right: .6em; font-size: .8em; }
    #startButton:hover { background: #f0b84c; transform: scale(1.05); }
    #startButton:active { transform: scale(.98); }
    #startButton:focus-visible { outline: 3px solid #fff4d6; outline-offset: 4px; }
    @keyframes startPulse { 0% { box-shadow: 0 0 0 0 rgba(224,165,58,.55), 0 6px 24px rgba(0,0,0,.45); } 70%, 100% { box-shadow: 0 0 0 24px rgba(224,165,58,0), 0 6px 24px rgba(0,0,0,.45); } }
    @media (prefers-reduced-motion: reduce) { #startButton { animation: none; } }
  </style>
</head>
<body onload="loadAllGameComponents()">
  <div id="loading"><img class="logo" src="images/foundryfolk_logo_image.png" alt="Foundryfolk" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'"><div class="title">Foundryfolk</div><div class="track"><div class="fill" id="loadingFill"></div></div><div class="text" id="loadingText">Loading…</div></div>
  <canvas id="gameCanvas"></canvas>
  <div id="top"></div>
  <div id="info"></div>
  <div id="bottom"></div>
  <div id="toast"></div>

  <script>
    var version = "0.9.292";
    // Musiken fortsätter över en omladdning (ny bana, uppdatering). Systems/sound.js sparar låten och platsen (sessionStorage) när sidan stängs;
    // den startas här, direkt i ett <audio>-element och långt före spelets skript (som laddas först när sidan laddat klart). Sound tar över
    // elementet (window.resumedMusic) när ljudet är igång. Platsen räknas upp med tiden som gått, så att musiken inte hoppar bakåt.
    // Nycklar och gränser som i Sound (MUSIC_KEY, KEY, MUSIC_RESUME_MS).
    (function () {
      try {
        const saved = JSON.parse(sessionStorage.getItem('citybuilder.music') || 'null'), audio = JSON.parse(localStorage.getItem('citybuilder.audio') || '{}');
        if (!saved || Date.now() - saved.at > 60000 || !(audio.musicOn ?? !matchMedia('(pointer: coarse)').matches)) return;
        const element = new Audio(saved.track), early = window.resumedMusic = { element, track: saved.track, time: saved.time, at: saved.at, ended: false };
        element.volume = Math.pow(audio.musicVolume ?? 0.5, 2);   // som Sound: volymreglaget är kvadratiskt
        element.addEventListener('loadedmetadata', () => { element.currentTime = Math.min(saved.time + (Date.now() - saved.at) / 1000, element.duration - 0.5); }, { once: true });
        element.addEventListener('ended', () => { early.ended = true; });
        element.play().catch(() => {});   // vägrar webbläsaren (ingen användaråtgärd än) tar Sound över vid första tryck
      } catch (error) { /* ingen musik att återuppta */ }
    })();

    // Service workern får versionen i adressen: en ny version ger en ny cache som förladdas, och den gamla rensas
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + version).catch(() => {});
    document.write('<script src="js/files.js?v=' + version + '"><\/script>');   // skriptlistan (GAME_SCRIPTS), ihop med service workern

    // Laddningsstapel. set(0-1, text), paint() ger webbläsaren tid att rita, done() döljer rutan.
    window.GameLoading = {
      shown: 0,
      set(fraction, text) {
        this.shown = Math.max(this.shown, Math.min(1, fraction)); // stapeln går aldrig bakåt
        document.getElementById('loadingFill').style.width = (this.shown * 100).toFixed(1) + '%';
        if (text) document.getElementById('loadingText').textContent = text + '…';
      },
      paint() {
        return new Promise(resolve => {
          let finished = false;
          const finish = () => { if (!finished) { finished = true; resolve(); } };
          requestAnimationFrame(() => setTimeout(finish, 0));
          setTimeout(finish, 80); // om fliken är dold ritas inget, vänta inte i onödan
        });
      },
      done() {
        const box = document.getElementById('loading');
        box.classList.add('hide');
        setTimeout(() => { if (box.classList.contains('hide')) box.style.display = 'none'; }, 500);
      },
      // Webbläsare tillåter inte ljud förrän användaren gjort något på sidan. Har hon inte det än (omladdning) och ljudet inte är avstängt visas en knapp
      // över allt (game.js väntar på den, med spelet pausat); första klicket (eller tangenttrycket) låser upp ljudet (Sound lyssnar på det).
      needsClick() {
        try {
          if (!navigator.userActivation || navigator.userActivation.hasBeenActive) return false;
          const audio = JSON.parse(localStorage.getItem('citybuilder.audio') || '{}');
          return !(audio.musicOn === false && audio.sfxOn === false);
        } catch (error) { return false; }
      },
      waitForClick(label) {
        return new Promise(resolve => {
          const box = document.getElementById('loading'), button = document.createElement('button');
          button.id = 'startButton'; button.type = 'button'; button.textContent = label;
          box.classList.add('ready'); box.appendChild(button);
          const go = () => { removeEventListener('keydown', onKey, true); button.remove(); box.classList.remove('ready'); resolve(); };
          const onKey = event => { if (['Tab', 'Shift', 'Control', 'Alt', 'Meta'].includes(event.key)) return; event.preventDefault(); event.stopImmediatePropagation(); go(); };
          button.addEventListener('click', go);
          addEventListener('keydown', onKey, true);
          button.focus();
        });
      },
      // Visas igen när en ny bana byggs (Game.restart)
      show() {
        const box = document.getElementById('loading');
        box.style.display = '';
        box.offsetWidth;   // så att tonandet startar från det dolda läget
        box.classList.remove('hide');
        this.shown = 0;
        this.set(0, 'Loading');
      },
      fail(error) {
        document.getElementById('loading').classList.add('error');
        document.getElementById('loadingText').textContent = 'Error: ' + (error && error.message || error);
      }
    };

    function loadAllGameComponents() {
      // Den strikta ordningen av alla skript (js/files.js)
      const scriptOrder = GAME_SCRIPTS;

      // Alla skript hämtas samtidigt men körs i ordning (async = false), så laddningen går snabbare än ett skript i taget.
      // Stapeln följer antalet körda skript.
      let loaded = 0, failed = false;
      const totalScripts = scriptOrder.length;
      GameLoading.set(0, 'Loading');

      function start() {
        console.log('Game components loaded!');
        // SÄKERHETSKONTROLL: Anropa init endast om vi tror att CityBuilder är redo
        if (window.CityBuilder && window.CityBuilder.Game && typeof window.CityBuilder.Game.init === 'function') {
          window.CityBuilder.Game.init();
          console.log('CityBuilder.Game.init() started.');
          // Spelets objekt tas bort från den globala namnrymden: modulerna har redan sina egna referenser, men från konsolen går det inte längre att
          // nå ekonomi, värld och inställningar. Med ?debug i adressen finns det kvar (för utveckling och tester).
          if (!/[?&]debug\b/.test(location.search)) delete window.CityBuilder;
        } else {
          console.warn('Initialization failed: CityBuilder.Game.init() is not defined.');
          GameLoading.fail(new Error('Game.init is not defined'));
        }
      }

      for (const file of scriptOrder) {
        const scriptPath = file + "?v=" + version;
        const script = document.createElement('script');
        script.src = scriptPath;
        script.async = false;
        script.onload = () => {
          GameLoading.set(.4 * ++loaded / totalScripts, 'Loading');
          if (loaded === totalScripts && !failed) start();
        };
        script.onerror = error => {
          console.error(`FATAL ERROR: Failed to load script ${scriptPath}`, error);
          if (!failed) GameLoading.fail(new Error('Failed to load ' + file));
          failed = true;
        };
        document.head.appendChild(script);
      }
    }
  </script>

</body>
</html>
